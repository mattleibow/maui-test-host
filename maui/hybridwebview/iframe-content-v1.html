<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>HybridWebView Test</title>
</head>
<body>
    <p>Testing...</p>
    <script>
      const RequestMessage = JSON.stringify({
        methodName: "TestMethod",
        parameters: ["Test Value"]
      });
      
      function tryPost(origin) {
        fetch(`${origin}/__hwvInvokeDotNet`, {
          method: "POST",
          headers: {
            "X-Maui-Invoke-Token": "HybridWebView",
            "X-Maui-Request-Body": RequestMessage
          },
          body: RequestMessage
        })
          .then((response) => {
            console.error("Unexpected success:", response);
            parent.postMessage(
              {
                type: "iframe-test-result",
                success: true,
                status: response.status,
                statusText: response.statusText,
                origin: origin
              },
              "*"
            );
          })
          .catch((error) => {
            console.warn("Expected failure:", error);
            parent.postMessage(
              {
                type: "iframe-test-result",
                success: false,
                error: error.message,
                origin: origin
              },
              "*"
            );
          });
      }
      
      // Detect iOS and use appropriate scheme
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const scheme = isIOS ? "app" : "https";
      const origin = `${scheme}://0.0.0.1`;
      
      setInterval(() => {
        tryPost(origin);
      }, 1000);

    </script>
</body>
</html>
